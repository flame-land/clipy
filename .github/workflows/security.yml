name: Security checks

on:
  push:
  pull_request:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pip-audit
      - name: Check Python syntax
        run: python -m compileall -q main.py cogs services utils tests
      - name: Test download URL validation
        run: python -m unittest discover -s tests -v
      - name: Audit dependencies
        run: pip-audit -r requirements.txt